[package]
name = "animal-rush"
version = "0.2.0"
edition = "2024"

[target.x86_64-unknown-linux-gnu]
linker = "clang"

[dependencies]
bevy = { version = "0.18", features = ["mouse", "web", "touch"] }
state = { path = "../state" }
level = { path = "../level" }
main_menu = { path = "../main_menu" }
level_selector = { path = "../level_selector" }
tracing = "0.1.44"
bevy-inspector-egui = "0.36.0"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"

[features]
inspector = []
